name: Profile Screenshot2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fluxbox \
            xterm \
            lolcat \
            imagemagick \
            xvfb \
            xdotool \
            fortune-mod \
            x11vnc \
            novnc \
            websockify \
            curl

      - name: Start X display
        run: |
          Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 2

          if ! kill -0 "$(cat /tmp/xvfb.pid)" 2>/dev/null; then
            echo "Xvfb failed"
            cat /tmp/xvfb.log || true
            exit 1
          fi

      - name: Start Fluxbox
        env:
          DISPLAY: :99
        run: |
          fluxbox > /tmp/fluxbox.log 2>&1 &
          echo $! > /tmp/fluxbox.pid
          sleep 2

          if ! kill -0 "$(cat /tmp/fluxbox.pid)" 2>/dev/null; then
            echo "Fluxbox failed"
            cat /tmp/fluxbox.log || true
            exit 1
          fi

      - name: Start Xterm
        env:
          DISPLAY: :99
        run: |
          xterm \
            -title "gioyous.it GitHub Actions Desktop" \
            -geometry 105x32+20+20 \
            -fa "Monospace" \
            -fs 15 \
            -bg black \
            -fg white \
            -e bash -c '
              clear

              echo "=============================================================="
              echo "              gioyous.it GitHub Actions"
              echo "=============================================================="
              echo
              echo "WORKFLOW"
              echo "Profile Screenshot2"
              echo
              echo "ENVIRONMENT"
              echo "OS Ubuntu"
              echo "Display Xvfb :99"
              echo "Window Manager Fluxbox"
              echo "Terminal Xterm"
              echo "VNC x11vnc"
              echo "noVNC websockify"
              echo
              echo "STATUS"
              echo "X server running"
              echo "Fluxbox running"
              echo "Xterm running"
              echo "VNC server running"
              echo "noVNC running"
              echo "Screenshot captured"
              echo "Cloudflare Tunnel starting"
              echo
              echo "TIMESTAMP"
              date "+%Y-%m-%d %H:%M:%S %Z" | lolcat
              echo
              echo "RANDOM UNIX WISDOM"
              fortune 2>/dev/null | head -n 3 | lolcat || true
              echo
              echo "STATUS SCREENSHOT READY"
              echo
              echo "=============================================================="
              echo "Generated automatically by GitHub Actions"
              echo "=============================================================="

              while true; do
                sleep 60
              done
            ' &

          for i in {1..20}; do
            if xdotool search \
              --name "gioyous.it GitHub Actions Desktop" \
              >/dev/null 2>&1; then
              echo "Xterm found"
              exit 0
            fi

            sleep 1
          done

          echo "Xterm was not found"
          exit 1

      - name: Capture desktop
        env:
          DISPLAY: :99
        run: |
          import \
            -display :99 \
            -window root \
            0.png

      - name: Verify screenshot
        run: |
          file 0.png
          identify 0.png

      - name: Start passwordless VNC
        env:
          DISPLAY: :99
        run: |
          x11vnc \
            -display :99 \
            -rfbport 5900 \
            -listen 127.0.0.1 \
            -forever \
            -shared \
            -nopw \
            -xkb \
            -noxrecord \
            -noxfixes \
            -noxdamage \
            > /tmp/x11vnc.log 2>&1 &

          echo $! > /tmp/x11vnc.pid
          sleep 3

          if ! kill -0 "$(cat /tmp/x11vnc.pid)" 2>/dev/null; then
            echo "x11vnc failed"
            cat /tmp/x11vnc.log || true
            exit 1
          fi

      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > /tmp/websockify.log 2>&1 &

          echo $! > /tmp/websockify.pid
          sleep 3

          if ! kill -0 "$(cat /tmp/websockify.pid)" 2>/dev/null; then
            echo "websockify failed"
            cat /tmp/websockify.log || true
            exit 1
          fi

      - name: Verify noVNC
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "noVNC is working"

      - name: Detect original address
        id: original
        run: |
          PUBLIC_IP="$(curl -4 -fsS https://api.ipify.org || true)"

          if [ -n "$PUBLIC_IP" ]; then
            echo "vnc=tcp://$PUBLIC_IP:5900" >> "$GITHUB_OUTPUT"
            echo "novnc=http://$PUBLIC_IP:6080/vnc.html?autoconnect=true&resize=remote" >> "$GITHUB_OUTPUT"
          else
            echo "vnc=N/A" >> "$GITHUB_OUTPUT"
            echo "novnc=N/A" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cloudflared
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            --output /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --loglevel info \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          TUNNEL_URL=""

          for i in {1..60}; do
            TUNNEL_URL="$(
              grep -oE \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                | head -n 1 \
                || true
            )"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Cloudflare Tunnel URL was not found"
            echo
            cat /tmp/cloudflared.log || true
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          echo "Cloudflare Tunnel URL"
          echo "$TUNNEL_URL"

      - name: Create STATUS.txt
        env:
          ORIGINAL_VNC: ${{ steps.original.outputs.vnc }}
          ORIGINAL_NOVNC: ${{ steps.original.outputs.novnc }}
        run: |
          TUNNEL_NOVNC="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"
          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          printf '%s\n' \
            'GITHUB ACTIONS DESKTOP STATUS' \
            '' \
            'STATUS ONLINE' \
            '' \
            'WORKFLOW' \
            'Profile Screenshot2' \
            '' \
            'STARTED' \
            "$TIMESTAMP" \
            '' \
            'CLOUDFLARE TUNNEL' \
            "$TUNNEL_NOVNC" \
            '' \
            'ORIGINAL NOVNC' \
            "$ORIGINAL_NOVNC" \
            '' \
            'ORIGINAL VNC' \
            "$ORIGINAL_VNC" \
            '' \
            'DESKTOP' \
            'OS Ubuntu' \
            'DISPLAY Xvfb :99' \
            'WINDOW MANAGER Fluxbox' \
            'TERMINAL Xterm' \
            'VNC x11vnc' \
            'NOVNC websockify' \
            'VNC PORT 5900' \
            'NOVNC PORT 6080' \
            '' \
            'VNC AUTHENTICATION' \
            'DISABLED' \
            '' \
            'SECURITY' \
            'The desktop is publicly accessible.' \
            'Anyone with the public URL may be able to interact with it.' \
            'Do not place secrets or credentials in this environment.' \
            '' \
            'LIFETIME' \
            'The desktop exists while the GitHub Actions job is running.' \
            '' \
            'LAST UPDATED' \
            "$TIMESTAMP" \
            > STATUS.txt

          echo "STATUS.txt created"
          echo "--------------------------------"
          cat STATUS.txt
          echo "--------------------------------"

      - name: Update README VNC marker
        env:
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")

          if not path.exists():
              print("README.md does not exist")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          url = (
              os.environ["TUNNEL_URL"]
              + "/vnc.html?autoconnect=true&resize=remote"
          )

          new_text, count = re.subn(
              r"<VNC=[^>\r\n]*>",
              "<VNC=" + url + ">",
              text,
              count=1
          )

          if count == 0:
              print("No VNC marker found")
              raise SystemExit(0)

          path.write_text(new_text, encoding="utf-8")

          print("README VNC marker updated")
          PY

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 0.png
          git add STATUS.txt
          git add README.md

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: update desktop status"
            git push
          fi

      - name: Show access information
        env:
          ORIGINAL_VNC: ${{ steps.original.outputs.vnc }}
          ORIGINAL_NOVNC: ${{ steps.original.outputs.novnc }}
        run: |
          echo
          echo "=============================================================="
          echo "GIOYOUS.IT LIVE DESKTOP"
          echo "=============================================================="
          echo
          echo "CLOUDFLARE TUNNEL"
          echo "${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"
          echo
          echo "ORIGINAL NOVNC"
          echo "$ORIGINAL_NOVNC"
          echo
          echo "ORIGINAL VNC"
          echo "$ORIGINAL_VNC"
          echo
          echo "=============================================================="

      - name: Keep desktop alive
        run: |
          echo "Desktop is live"
          echo "Cloudflare"
          echo "${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"
          echo

          while true; do
            kill -0 "$(cat /tmp/xvfb.pid)" || exit 1
            kill -0 "$(cat /tmp/fluxbox.pid)" || exit 1
            kill -0 "$(cat /tmp/x11vnc.pid)" || exit 1
            kill -0 "$(cat /tmp/websockify.pid)" || exit 1
            kill -0 "$(cat /tmp/cloudflared.pid)" || exit 1

            sleep 60
          done