name: Profile Screenshot2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install desktop and VNC
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            fluxbox \
            xterm \
            lolcat \
            imagemagick \
            xvfb \
            xdotool \
            fortune-mod \
            x11vnc \
            novnc \
            websockify \
            curl

      - name: Start X display
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          echo "$!" > /tmp/xvfb.pid

          sleep 2

          if ! kill -0 "$(cat /tmp/xvfb.pid)" 2>/dev/null; then
            echo "Xvfb failed to start."
            exit 1
          fi

      - name: Start Fluxbox
        env:
          DISPLAY: :99
        run: |
          fluxbox > /tmp/fluxbox.log 2>&1 &
          echo "$!" > /tmp/fluxbox.pid

          sleep 2

          if ! kill -0 "$(cat /tmp/fluxbox.pid)" 2>/dev/null; then
            echo "Fluxbox failed to start."
            cat /tmp/fluxbox.log || true
            exit 1
          fi

      - name: Open Xterm
        env:
          DISPLAY: :99
        run: |
          xterm \
            -title "gioyous.it • GitHub Actions Desktop" \
            -geometry 105x32+20+20 \
            -fa "Monospace" \
            -fs 15 \
            -bg black \
            -fg white \
            -e bash -c '
              clear

              echo
              echo "=============================================================="
              echo "              gioyous.it • GitHub Actions"
              echo "=============================================================="
              echo

              echo "  WORKFLOW"
              echo "  --------"
              echo "  Profile Screenshot2"
              echo

              echo "  ENVIRONMENT"
              echo "  -----------"
              echo "  OS:       Ubuntu"
              echo "  Display:  Xvfb :99"
              echo "  WM:       Fluxbox"
              echo "  Terminal: Xterm"
              echo "  VNC:      x11vnc"
              echo "  noVNC:    websockify"
              echo

              echo "  THIS DESKTOP"
              echo "  ------------"
              echo "  ✓ X server started"
              echo "  ✓ Fluxbox started"
              echo "  ✓ Xterm started"
              echo "  ✓ VNC server started"
              echo "  ✓ noVNC started"
              echo "  ✓ Screenshot captured"
              echo "  ✓ Public tunnel starting"
              echo

              echo "  TIMESTAMP"
              echo "  ---------"
              date "+  %Y-%m-%d %H:%M:%S %Z" | lolcat

              echo
              echo "  RANDOM UNIX WISDOM"
              echo "  ------------------"
              fortune 2>/dev/null | head -n 3 | lolcat || true

              echo
              echo "  STATUS: DESKTOP READY"
              echo
              echo "=============================================================="
              echo "  Generated automatically by GitHub Actions"
              echo "=============================================================="

              while true; do
                sleep 60
              done
            ' &

          echo "Waiting for Xterm..."

          for i in {1..20}; do
            if xdotool search \
              --name "gioyous.it • GitHub Actions Desktop" \
              >/dev/null 2>&1; then

              echo "Xterm found!"
              break
            fi

            sleep 1
          done

          if ! xdotool search \
            --name "gioyous.it • GitHub Actions Desktop" \
            >/dev/null 2>&1; then

            echo "Xterm was not found."
            exit 1
          fi

          sleep 3

      - name: Capture profile screenshot
        env:
          DISPLAY: :99
        run: |
          import -window root 0.png

      - name: Verify screenshot
        run: |
          file 0.png
          identify 0.png

      - name: Start passwordless VNC
        env:
          DISPLAY: :99
        run: |
          echo "Starting passwordless x11vnc..."

          x11vnc \
            -display :99 \
            -rfbport 5900 \
            -listen 127.0.0.1 \
            -forever \
            -shared \
            -nopw \
            -xkb \
            -noxrecord \
            -noxfixes \
            -noxdamage \
            > /tmp/x11vnc.log 2>&1 &

          echo "$!" > /tmp/x11vnc.pid

          sleep 3

          if ! kill -0 "$(cat /tmp/x11vnc.pid)" 2>/dev/null; then
            echo "x11vnc failed to start."
            cat /tmp/x11vnc.log || true
            exit 1
          fi

          echo "VNC server is running."

      - name: Start noVNC
        run: |
          echo "Starting noVNC..."

          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > /tmp/websockify.log 2>&1 &

          echo "$!" > /tmp/websockify.pid

          sleep 3

          if ! kill -0 "$(cat /tmp/websockify.pid)" 2>/dev/null; then
            echo "websockify failed to start."
            cat /tmp/websockify.log || true
            exit 1
          fi

          echo "noVNC is running."

      - name: Verify noVNC locally
        run: |
          echo "Testing local noVNC server..."

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "Local noVNC server is responding."

      - name: Detect original runner address
        id: original
        run: |
          PUBLIC_IP="$(curl -4 -fsS https://api.ipify.org || true)"

          if [ -n "$PUBLIC_IP" ]; then
            echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

            echo \
              "vnc=tcp://$PUBLIC_IP:5900" \
              >> "$GITHUB_OUTPUT"

            echo \
              "novnc=http://$PUBLIC_IP:6080/vnc.html?autoconnect=true&resize=remote" \
              >> "$GITHUB_OUTPUT"

            echo "Detected public runner IP: $PUBLIC_IP"
          else
            echo "public_ip=" >> "$GITHUB_OUTPUT"
            echo "vnc=N/A" >> "$GITHUB_OUTPUT"
            echo "novnc=N/A" >> "$GITHUB_OUTPUT"

            echo "Could not determine public IP."
          fi

      - name: Install cloudflared
        run: |
          echo "Downloading cloudflared..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            --output /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        run: |
          rm -f /tmp/cloudflared.log

          echo "Starting Cloudflare Quick Tunnel..."

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --loglevel info \
            > /tmp/cloudflared.log 2>&1 &

          echo "$!" > /tmp/cloudflared.pid

          echo "Waiting for the REAL Cloudflare URL..."

          TUNNEL_URL=""

          for i in {1..60}; do
            TUNNEL_URL="$(
              grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                | head -n 1 \
                || true
            )"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo
            echo "Cloudflare did not provide a Quick Tunnel URL."
            echo
            echo "================ CLOUDFLARE LOG ================"
            cat /tmp/cloudflared.log || true
            echo "=================================================="
            exit 1
          fi

          echo "Cloudflare Tunnel:"
          echo "$TUNNEL_URL"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

      - name: Verify Cloudflare Tunnel
        run: |
          TUNNEL_NOVNC="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"

          echo "Testing:"
          echo "$TUNNEL_NOVNC"

          HTTP_CODE="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 20 \
              "$TUNNEL_NOVNC" \
              || true
          )"

          echo "HTTP status: $HTTP_CODE"

          case "$HTTP_CODE" in
            2*|3*)
              echo "Cloudflare Tunnel is responding."
              ;;
            *)
              echo "WARNING: Tunnel did not return a normal HTTP response yet."
              echo
              echo "Cloudflare log:"
              cat /tmp/cloudflared.log || true
              ;;
          esac

      - name: Create STATUS.md
        env:
          ORIGINAL_VNC: ${{ steps.original.outputs.vnc }}
          ORIGINAL_NOVNC: ${{ steps.original.outputs.novnc }}
        run: |
          TUNNEL_NOVNC="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"

          cat > STATUS.md <<EOF
# GitHub Actions Desktop Status

**Status** 🟢 ONLINE

**Workflow** \`Profile Screenshot2\`

**Started** $(date -u "+%Y-%m-%d %H:%M:%S UTC")

## 🌐 Access

### Cloudflare Tunnel

[Open the live desktop]($TUNNEL_NOVNC)

**URL** $TUNNEL_NOVNC

### Original noVNC endpoint

$ORIGINAL_NOVNC

### Original VNC endpoint

$ORIGINAL_VNC

> The Cloudflare URL above is the intended public access method.
>
> The original endpoint is shown separately and is only a best-effort runner address. GitHub-hosted runners normally do not accept arbitrary inbound connections.

## 🖥️ Desktop

- OS: Ubuntu
- Display Xvfb 99
- Window manager Fluxbox
- Terminal Xterm
- VNC server x11vnc
- VNC port 5900
- noVNC/websockify port 6080
- VNC authentication: disabled

## ☁️ Tunnel

- Provider Cloudflare
- Type Quick Tunnel
- Origin \`http://127.0.0.1:6080\`
- Public hostname \`$TUNNEL_URL\`

## ⚠️ Security

This desktop is intentionally exposed without a VNC password.

Anyone who obtains the public Cloudflare URL may be able to interact with the desktop.

Do not place secrets, tokens, private keys, credentials, or private files in this environment.

## ⏱️ Lifetime

This page represents the current GitHub Actions job.

The desktop disappears when the workflow stops or the runner is terminated.

Last updated: $(date -u "+%Y-%m-%d %H:%M:%S UTC")
EOF

          echo "STATUS.md created."

      - name: Update README VNC marker
        env:
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")

          if not path.exists():
              print("README.md does not exist.")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          tunnel_url = (
              os.environ["TUNNEL_URL"]
              + "/vnc.html?autoconnect=true&resize=remote"
          )

          pattern = r"<VNC=[^>\r\n]*>"

          replacement = f"<VNC={tunnel_url}>"

          new_text, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
          )

          if count == 0:
              print("No <VNC=...> marker found.")
              print("README.md was not modified.")
              raise SystemExit(0)

          path.write_text(new_text, encoding="utf-8")

          print("Updated README.md VNC marker.")
          PY

      - name: Commit screenshot and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 0.png
          git add STATUS.md
          git add README.md

          if git diff --cached --quiet; then
            echo "No repository changes."
          else
            git commit \
              -m "chore: update desktop screenshot and status"

            git push
          fi

      - name: Show access information
        env:
          ORIGINAL_VNC: ${{ steps.original.outputs.vnc }}
          ORIGINAL_NOVNC: ${{ steps.original.outputs.novnc }}
        run: |
          echo
          echo "=============================================================="
          echo "                 GIOYOUS.IT LIVE DESKTOP"
          echo "=============================================================="
          echo
          echo "Cloudflare noVNC:"
          echo "${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"
          echo
          echo "Original noVNC:"
          echo "$ORIGINAL_NOVNC"
          echo
          echo "Original VNC:"
          echo "$ORIGINAL_VNC"
          echo
          echo "=============================================================="

      - name: Keep desktop alive
        run: |
          echo "Desktop is LIVE."
          echo
          echo "Cloudflare:"
          echo "${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"
          echo
          echo "Keeping the GitHub Actions runner alive."

          while true; do
            if ! kill -0 "$(cat /tmp/xvfb.pid)" 2>/dev/null; then
              echo "Xvfb stopped."
              exit 1
            fi

            if ! kill -0 "$(cat /tmp/fluxbox.pid)" 2>/dev/null; then
              echo "Fluxbox stopped."
              exit 1
            fi

            if ! kill -0 "$(cat /tmp/x11vnc.pid)" 2>/dev/null; then
              echo "x11vnc stopped."
              exit 1
            fi

            if ! kill -0 "$(cat /tmp/websockify.pid)" 2>/dev/null; then
              echo "websockify stopped."
              exit 1
            fi

            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "cloudflared stopped."
              exit 1
            fi

            sleep 60
          done